.base:
  tags:
    - self

.rust:
  extends: .base
  image: $CI_REGISTRY_IMAGE/ci-env:$CI_COMMIT_REF_SLUG
  timeout: 1h
  # Explicite pour inclure aussi les merge requests (jobs sans rules exclus des MR).
  rules:
    - when: on_success
  variables:
    GIT_DEPTH: '0'
    DOCKER_HOST: unix:///var/run/docker.sock
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: '1'
  cache:
    key:
      prefix: cargo-bookworm-x86_64-rust-1.100
      files:
        - client/Cargo.lock
        - server/Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
