.rust:
  image:
    name: build-romstore
    entrypoint: ['']
  timeout: 1h
  # Explicite pour inclure aussi les merge requests (jobs sans rules exclus des MR).
  rules:
    - when: on_success
  variables:
    GIT_DEPTH: '0'
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    RUSTUP_HOME: /root/.rustup
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: '1'
  cache:
    key:
      prefix: cargo-bookworm-x86_64-rust-1.90.0
      files:
        - client/Cargo.lock
        - server/Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
