.base:
  tags:
    - self

.rust:
  extends: .base
  image: docker:27-cli
  timeout: 1h
  # Explicite pour inclure aussi les merge requests (jobs sans rules exclus des MR).
  rules:
    - when: on_success
  variables:
    GIT_DEPTH: '0'
    DOCKER_HOST: unix:///var/run/docker.sock
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: '1'
  cache:
    key:
      prefix: cargo-bookworm-x86_64-rust-1.100
      files:
        - client/Cargo.lock
        - server/Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
  before_script:
    # Le cache du démon Docker ne reconstruit que les couches modifiées.
    - docker build -t "romstore-ci:$CI_JOB_ID" .gitlab/ci
  script:
    - |
      docker run --rm -i --volumes-from "$HOSTNAME" --workdir "$CI_PROJECT_DIR" \
        --env CARGO_HOME --env CARGO_TERM_COLOR --env RUST_BACKTRACE \
        --env CI_SCRIPT --env CI_COMMIT_TAG --env CI_COMMIT_SHA \
        --env CI_COMMIT_BRANCH --env CI_PIPELINE_SOURCE --env CI_COMMIT_REF_PROTECTED \
        --env CI_PROJECT_URL --env CI_JOB_ID --env GITLAB_RELEASE_TOKEN \
        --env RELEASE_COMPONENT --env RELEASE_TYPE \
        "romstore-ci:$CI_JOB_ID" bash -euo pipefail <<'BASH'
      git config --global --add safe.directory "$PWD"
      CI_COMPONENT=all
      case "${CI_COMMIT_TAG:-}" in
        client-v*) CI_COMPONENT=client ;;
        server-v*) CI_COMPONENT=server ;;
      esac
      CI_CRATES="$CI_COMPONENT"
      if [ "$CI_COMPONENT" = all ]; then CI_CRATES='client server'; fi
      export CI_COMPONENT CI_CRATES
      eval "$CI_SCRIPT"
      BASH
  after_script:
    - docker image rm "romstore-ci:$CI_JOB_ID"
