include:
  - local: .gitlab/ci/base.yml

stages: [release]

.prepare-release:
  extends: .rust
  stage: release
  # Verrou partagé par les releases client et serveur, dans toutes les pipelines.
  resource_group: release-main
  when: manual
  allow_failure: true
  # Installé uniquement pour la préparation ; compatible avec Rust 1.90.
  before_script:
    - !reference [.rust, before_script]
    - cargo install cargo-release --version 1.0.0 --locked --no-default-features --features vendored-libgit2
  manual_confirmation: Confirmer la création du commit de version et du tag sur main ?
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "parent_pipeline"'
