[package]
name = "romstore-server"
version = "0.1.2"
edition = "2021"
rust-version = "1.90"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
fs2 = "0.4"
hex = "0.4"
icu_casemap = "2.4"
libc = "0.2"
roxmltree = "0.21"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5"

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
