stages:
  - prepare
  - quality
  - units-test
  - build
  - tests
  - release
  - publish

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^chore\(release\)/
      when: never
    - when: always

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

default:
  image: rust:1.100
  before_script:
    - apt update && apt install cmake -y
  cache:
    key: cargo
    paths:
      - .cargo/bin/
      - .cargo/registry/
      - .cargo/git/
      - target/

quality:
  stage: quality
  script:
    - rustup component add rustfmt clippy
    - |
      [ ! -e .cargo/bin/gitlab-clippy ] && cargo install gitlab_clippy
    - cargo check --workspace --all-targets
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --message-format=json -- -D warnings > clippy.json
    - .cargo/bin/gitlab-clippy < clippy.json > gl-code-quality-report.json
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json

.units-test-template:
  stage: units-test
  script:
    - |
      [ ! -e .cargo/bin/cargo-nextest ] && cargo install cargo-nextest
    - cargo nextest run --profile ci
  artifacts:
    when: always
    reports:
      junit: junit.xml
  rules:
    - changes:
        - ${CRATE_NAME}/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
        
units-test:client:
  extends: .units-test-template
  variables:
    CRATE_NAME: client
units-test:server:
  extends: .units-test-template
  variables:
    CRATE_NAME: server

.build-template:
  stage: build
  before_script:
    - apt update
    - apt install -y build-essential clang lld cmake ninja-build pkg-config
    - |
      case "${RELEASE_TARGET}" in
        "x86_64-unknown-linux-musl")
          apt install -y musl musl-tools
        ;;
        "aarch64-unknown-linux-gnu")
          apt install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross
        ;;
        "armv7-unknown-linux-gnueabihf")
          apt install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libc6-dev-armhf-cross 
        ;;
        "arm-unknown-linux-gnueabihf")
          apt install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libc6-dev-armhf-cross 
        ;;
        "armv5te-unknown-linux-gnueabi")
          apt install -y gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi libc6-dev-armel-cross
        ;;
        "x86_64-pc-windows-gnu")
          apt install -y mingw-w64 gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
        ;;
      esac
    - rustup target add "${RELEASE_TARGET}"
  variables:
    CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
    AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
    AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
    CC_arm_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
    AR_arm_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
    CFLAGS_arm_unknown_linux_gnueabihf: "-march=armv6 -mfpu=vfp -mfloat-abi=hard"
    CC_armv5te_unknown_linux_gnueabi: arm-linux-gnueabi-gcc
    AR_armv5te_unknown_linux_gnueabi: arm-linux-gnueabi-ar
    CFLAGS_armv5te_unknown_linux_gnueabi: "-march=armv5te -mfloat-abi=soft"
    CC_aarch64_pc_windows_gnullvm: aarch64-w64-mingw32-clang
    AR_aarch64_pc_windows_gnullvm: llvm-ar
    CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
    AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
  script:
    - cargo build -p romstore-${CRATE_NAME} --release --target ${RELEASE_TARGET}
  artifacts:
    paths:
      - target/release/${RELEASE_TARGET}/romstore-${CRATE_NAME}
  rules:
    - changes:
        - ${CRATE_NAME}/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml

build:client:linux:x86_64:
  extends: .build-template
  variables:
    CRATE_NAME: client
    RELEASE_TARGET: x86_64-unknown-linux-gnu
build:server:linux:x86_64:
  extends: .build-template
  variables:
    CRATE_NAME: server
    RELEASE_TARGET: x86_64-unknown-linux-gnu
  
build:client:linux:x86_64-musl:
  extends: .build-template
  variables:
    CRATE_NAME: client
    RELEASE_TARGET: x86_64-unknown-linux-musl
build:server:linux:x86_64-musl:
  extends: .build-template
  variables:
    CRATE_NAME: server
    RELEASE_TARGET: x86_64-unknown-linux-musl

build:client:windows:x86_64:
  extends: .build-template
  variables:
    CRATE_NAME: client
    RELEASE_TARGET: x86_64-pc-windows-gnu
build:server:windows:x86_64:
  extends: .build-template
  variables:
    CRATE_NAME: server
    RELEASE_TARGET: x86_64-pc-windows-gnu

.release-template:
  stage: release
  before_script:
    - cargo install cargo-release
    - git config user.name "FramaGit CI"
    - git config user.email "framagit@xataz.net"
    - git remote set-url origin "https://oauth2:${GITLAB_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git checkout -B "$CI_COMMIT_REF_NAME" "$CI_COMMIT_SHA"
  script:
    - cargo release -p "romstore-${CRATE_NAME}" "${RELEASE_LEVEL}" --execute
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ${CRATE_NAME}/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
      when: manual

release:
  extends: .release-template
  parallel:
    matrix:
      - CRATE_NAME:
          - client
          - server
        RELEASE_LEVEL:
          - patch
          - minor
          - major

