stages:
  - quality
  - units-test
  - build
  - tests
  - release
  - publish

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

default:
  image: rust:1.100
  before_script:
    - apt update && apt install cmake -y
  cache:
    key: cargo
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/

quality:
  stage: quality
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings

.units-test-template:
  stage: units-test
  script:
    - cargo test -p romstore-${CRATE_NAME} --all-targets
  rules:
    - changes:
        - ${CRATE_NAME}/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
        
units-test:client:
  extends: .units-test-template
  variables:
    CRATE_NAME: client
units-test:server:
  extends: .units-test-template
  variables:
    CRATE_NAME: server

.build-template:
  stage: build
  script:
    - cargo build -p romstore-${CRATE_NAME} --release
  artifacts:
    paths:
      - target/release/romstore-${CRATE_NAME}
  rules:
    - changes:
        - ${CRATE_NAME}/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml

build:client:
  extends: .build-template
  variables:
    CRATE_NAME: client
build:server:
  extends: .build-template
  variables:
    CRATE_NAME: server
  
.release-template:
  stage: release
  before_script:
    - cargo install cargo-release
    - git config user.name "FramaGit CI"
    - git config user.email "framagit@xataz.net"
    - git remote set-url origin "https://oauth2:${GITLAB_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - cargo release -p "romstore-${CRATE_NAME}" "${RELEASE_LEVEL}" --execute
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ${CRATE_NAME}/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
      when: manual

release:
  extends: .release-template
  parallel:
    matrix:
      - CRATE_NAME:
          - client
          - server
        RELEASE_LEVEL:
          - patch
          - minor
          - major

