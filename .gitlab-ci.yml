include:
  - local: .gitlab/ci/base.yml

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(client|server)-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
    - if: '$CI_COMMIT_TAG'
      when: never
    # Le push atomique de release ne doit lancer que la pipeline du tag.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TITLE =~ /^chore\((client|server)\): prépare la version [0-9]+\.[0-9]+\.[0-9]+$/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [prepare, check, test, build, release, publish]

variables:
  CI_ENV_IMAGE: $CI_REGISTRY_IMAGE/ci-env:latest
  RELEASE_COMPONENT:
    value: client
    options: [client, server]
    description: Composant à publier (modifiable dans le formulaire du job release).
  RELEASE_TYPE:
    value: fix
    options: [fix, minor, major]
    description: Incrément de version (modifiable dans le formulaire du job release).

build-env:
  extends: .base
  stage: prepare
  image: quay.io/buildah/stable
  resource_group: ci-env
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - buildah bud --layers -t "$CI_ENV_IMAGE" .gitlab/ci
    - buildah push "$CI_ENV_IMAGE" "docker://$CI_ENV_IMAGE"
  rules:
    # Pas de reconstruction sur les tags, les schedules ou les lancements manuels.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab/ci/Dockerfile
    # Sans compare_to, changes est toujours vrai au premier push d'une branche.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      changes:
        compare_to: 'refs/heads/$CI_DEFAULT_BRANCH'
        paths:
          - .gitlab/ci/Dockerfile
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BEFORE_SHA != "0000000000000000000000000000000000000000")'
      changes:
        - .gitlab/ci/Dockerfile

check:
  extends: .rust
  stage: check
  script:
    - |
      for crate in $CI_CRATES; do
        cargo fmt --manifest-path "$crate/Cargo.toml" -- --check
        cargo clippy --locked --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings
      done
    - make test-ci

test:
  extends: .rust
  stage: test
  script:
    - if [ "$CI_COMPONENT" != client ]; then node --test server/tests/admin_ui.test.mjs; fi
    - |
      for crate in $CI_CRATES; do
        make "test-$crate"
      done

build:
  extends: .rust
  stage: build
  script:
    - make "$CI_COMPONENT"
    - |
      if [ "$CI_COMPONENT" = all ]; then
        ROMSTORE_CLIENT="$PWD/client/target/release/romstore-client" \
          cargo test --locked --manifest-path server/Cargo.toml --test e2e -- --ignored
      fi
    - |
      if [ "$CI_COMPONENT" != server ]; then
        export SDL_VIDEODRIVER=dummy
        client/target/release/romstore-client --smoke-test
        cargo test --locked --manifest-path client/Cargo.toml --bin romstore-client \
          sdl_text_rendering_refreshes_density_on_resize_and_bounds_the_cache -- --ignored
      fi
    - mkdir -p dist
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then bash scripts/ci/package.sh "$CI_COMMIT_TAG"; fi
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

# Framagit ne fournit pas de Package Registry. Conserver les fichiers dans un
# job terminé avec succès avant de créer les liens de téléchargement de la release.
release-files:
  extends: .rust
  stage: build
  needs:
    - job: build
      artifacts: true
  script:
    - bash scripts/ci/package.sh "$CI_COMMIT_TAG" --release
  artifacts:
    paths:
      - dist/$CI_COMMIT_TAG/
      - dist/release.env
    expire_in: never
    reports:
      dotenv: dist/release.env
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(client|server)-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'

release:
  extends: .rust
  stage: release
  resource_group: release-main
  when: manual
  allow_failure: true
  manual_confirmation: Confirmer la création du commit de version et du tag sur main ?
  script:
    - bash scripts/ci/prepare-release.sh "$RELEASE_COMPONENT" "$RELEASE_TYPE" --push "$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

publish:
  extends: .base
  image: registry.gitlab.com/gitlab-org/cli:v1.76.0
  stage: publish
  resource_group: publish-$CI_COMMIT_TAG
  variables:
    GIT_DEPTH: '0'
  needs:
    - job: release-files
      artifacts: true
  before_script:
    - apk add --no-cache bash curl
  script:
    - bash scripts/ci/verify-release.sh
  release:
    tag_name: $CI_COMMIT_TAG
    name: $RELEASE_TITLE
    description: dist/$CI_COMMIT_TAG/CHANGELOG.md
    assets:
      links:
        - name: $RELEASE_ARCHIVE
          url: $RELEASE_ASSET_BASE_URL/$RELEASE_ARCHIVE
          filepath: /$RELEASE_ARCHIVE
          link_type: other
        - name: SHA256SUMS
          url: $RELEASE_ASSET_BASE_URL/SHA256SUMS
          filepath: /SHA256SUMS
          link_type: other
        - name: CHANGELOG.md
          url: $RELEASE_ASSET_BASE_URL/CHANGELOG.md
          filepath: /CHANGELOG.md
          link_type: other
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(client|server)-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
