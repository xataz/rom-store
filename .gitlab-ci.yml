include:
  - local: .gitlab/ci/base.yml

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(client|server)-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [prepare, check, test, build, release, publish]

build-image:
  stage: prepare
  image: docker
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  script:
    - |
      cd .gitlab/ci
      docker build -t build-romstore .

check:
  extends: .rust
  stage: check
  script:
    - |
      for crate in $CI_CRATES; do
        cargo fmt --manifest-path "$crate/Cargo.toml" -- --check
        cargo clippy --locked --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings
      done
    - make test-ci

test:
  extends: .rust
  stage: test
  script:
    - if [ "$CI_COMPONENT" != client ]; then node --test server/tests/admin_ui.test.mjs; fi
    - |
      for crate in $CI_CRATES; do
        make "test-$crate"
      done

build:
  extends: .rust
  stage: build
  script:
    - make "$CI_COMPONENT"
    - |
      if [ "$CI_COMPONENT" = all ]; then
        ROMSTORE_CLIENT="$PWD/client/target/release/romstore-client" \
          cargo test --locked --manifest-path server/Cargo.toml --test e2e -- --ignored
      fi
    - |
      if [ "$CI_COMPONENT" != server ]; then
        export SDL_VIDEODRIVER=dummy
        client/target/release/romstore-client --smoke-test
        cargo test --locked --manifest-path client/Cargo.toml --bin romstore-client \
          sdl_text_rendering_refreshes_density_on_resize_and_bounds_the_cache -- --ignored
      fi
    - mkdir -p dist
    - printf 'BUILD_COMMIT=%s\n' "$CI_COMMIT_SHA" > dist/release.env
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then bash scripts/ci/package.sh "$CI_COMMIT_TAG"; fi
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
    reports:
      dotenv: dist/release.env

notes:
  extends: .base
  image:
    name: orhunp/git-cliff:2.10.1
    entrypoint: ['']
  stage: build
  variables:
    GIT_DEPTH: '0'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
  script:
    - bash scripts/ci/changelog.sh "$CI_COMMIT_TAG"
  artifacts:
    paths: [dist/]
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(client|server)-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'

generate-releases:
  extends: .base
  image:
    name: build-romstore
    entrypoint: ['']
  stage: build
  variables:
    GIT_DEPTH: '0'
  script:
    - git fetch origin --tags
    - bash scripts/ci/generate-releases.sh dist/release-jobs.yml
  artifacts:
    paths: [dist/release-jobs.yml]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Sans strategy: depend/mirror : les boutons manuels ne bloquent pas le parent.
release:
  stage: release
  trigger:
    include:
      - artifact: dist/release-jobs.yml
        job: generate-releases
    forward:
      yaml_variables: false
      pipeline_variables: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

publish:
  extends: .base
  image: registry.gitlab.com/gitlab-org/cli:v1.76.0
  stage: publish
  resource_group: publish-$CI_COMMIT_TAG
  variables:
    GIT_DEPTH: '0'
  needs:
    - job: build
      artifacts: true
    - job: notes
      artifacts: true
  before_script:
    - apk add --no-cache bash curl
  script:
    - bash scripts/ci/upload-release.sh
  release:
    tag_name: $CI_COMMIT_TAG
    name: $RELEASE_TITLE
    description: dist/$CI_COMMIT_TAG/CHANGELOG.md
    assets:
      links:
        - name: $RELEASE_ARCHIVE
          url: $RELEASE_PACKAGE_URL/$RELEASE_ARCHIVE
          filepath: /$RELEASE_ARCHIVE
          link_type: package
        - name: SHA256SUMS
          url: $RELEASE_PACKAGE_URL/SHA256SUMS
          filepath: /SHA256SUMS
          link_type: package
        - name: CHANGELOG.md
          url: $RELEASE_PACKAGE_URL/CHANGELOG.md
          filepath: /CHANGELOG.md
          link_type: package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(client|server)-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
