stages:
  - prepare
  - quality
  - units-test
  - build
  - tests
  - release
  - publish

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^chore\(release\)/
      when: never
    - when: always

variables:
  CARGO_TERM_COLOR: always
#  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

default:
  image: xataze/roms-store-builder:latest
  # before_script:
  #   - cp /opt/cargo/config.toml .cargo/config.toml
  cache:
    key: cargo
    paths:
      - /opt/cargo/registry/
      - /opt/cargo/git/
      - target/

quality:
  stage: quality
  script:
    - cargo check --workspace --all-targets
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --message-format=json -- -D warnings > clippy.json
    - gitlab-clippy < clippy.json > gl-code-quality-report.json
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json

.units-test-template:
  stage: units-test
  script:
    - cargo nextest run -p romstore-${RELEASE_NAME} --profile ci --config-file nextest.toml
  artifacts:
    when: always
    reports:
      junit: junit.xml
  rules:
    - changes:
        - ${RELEASE_NAME}/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
        
units-test:client:
  extends: .units-test-template
  variables:
    RELEASE_NAME: client
units-test:server:
  extends: .units-test-template
  variables:
    RELEASE_NAME: server

.build-template:
  stage: build
  script:
    - cargo build -p romstore-${RELEASE_NAME} --release --target ${RELEASE_TARGET}
  artifacts:
    paths:
      - target/release/${RELEASE_TARGET}/romstore-${RELEASE_NAME}
  rules:
    - changes:
        - ${RELEASE_NAME}/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml

build:client:linux:x86_64:
  extends: .build-template
  variables:
    RELEASE_NAME: client
    RELEASE_TARGET: x86_64-unknown-linux-gnu
build:server:linux:x86_64:
  extends: .build-template
  variables:
    RELEASE_NAME: server
    RELEASE_TARGET: x86_64-unknown-linux-gnu
  
