#  extends: .build-template
#  variables:
#    RELEASE_NAME: client
#    RELEASE_TARGET: x86_64-unknown-linux-musl
#build:server:linux:x86_64-musl:
#  extends: .build-template
#  variables:
#    RELEASE_NAME: server
#    RELEASE_TARGET: x86_64-unknown-linux-musl

build:client:windows:x86_64:
  extends: .build-template
  variables:
    RELEASE_NAME: client
    RELEASE_TARGET: x86_64-pc-windows-gnu
#build:server:windows:x86_64:
#  extends: .build-template
#  variables:
#    RELEASE_NAME: server
#    RELEASE_TARGET: x86_64-pc-windows-gnu

.release-template:
  stage: release
  script:
    - git config user.name "FramaGit CI"
    - git config user.email "framagit@xataz.net"
    - git remote set-url origin "https://oauth2:${GITLAB_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git checkout -B "$CI_COMMIT_REF_NAME" "$CI_COMMIT_SHA"
    - cargo release -p "romstore-${RELEASE_NAME}" "${RELEASE_LEVEL}" --execute
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ${RELEASE_NAME}/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
      when: manual

release:
  extends: .release-template
  parallel:
    matrix:
      - RELEASE_NAME:
          - client
          - server
        RELEASE_LEVEL:
          - patch
          - minor
          - major

