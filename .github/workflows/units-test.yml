name: Unit tests

on:
  workflow_call:
    inputs:
      components:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  units-test:
    name: units-test:${{ matrix.component }}
    runs-on: ubuntu-latest
    container: xataze/roms-store-builder:latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.components) }}
    env:
      RELEASE_NAME: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          key: cargo-${{ runner.os }}-test-${{ matrix.component }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cargo-${{ runner.os }}-test-${{ matrix.component }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-test-${{ matrix.component }}-
          path: |
            /opt/cargo/registry/
            /opt/cargo/git/
            target/
      - run: cargo nextest run -p "romstore-${RELEASE_NAME}" --profile ci --config-file nextest.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.component }}
          path: target/nextest/ci/junit.xml
