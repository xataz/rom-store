name: Batocera client packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native package in Debian Bookworm
        run: bash scripts/build-batocera.sh --arch '${{ matrix.arch }}' --engine docker
      - name: Install archive and render with Bookworm SDL2
        run: |
          docker run --rm -e SDL_VIDEODRIVER=dummy 'romstore-client-batocera:${{ matrix.arch }}' bash -euc '
            mkdir /tmp/package /tmp/userdata
            tar -xzf /out/*.tar.gz -C /tmp/package
            python3 /tmp/package/*/install.py --userdata /tmp/userdata --server http://127.0.0.1:8000 --no-reload
            /tmp/userdata/system/romstore/romstore-client --config /tmp/userdata/system/configs/romstore/config.yaml --smoke-test
          '
      - uses: actions/upload-artifact@v4
        with:
          name: romstore-client-batocera-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
