name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev pkg-config fonts-dejavu-core
      - name: Python dependencies
        run: python -m pip install 'pytest>=8,<10' 'ruff>=0.9,<1'
      - name: Installer tooling lint and format
        run: |
          ruff check packaging/batocera tests
          ruff format --check packaging/batocera tests
      - name: Batocera packaging and installer tests
        run: |
          bash -n scripts/build-batocera.sh
          sh -n packaging/batocera/launcher.sh
          pytest tests -q
      - name: Rust checks
        run: |
          cargo fmt --manifest-path client/Cargo.toml -- --check
          cargo clippy --locked --manifest-path client/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path client/Cargo.toml
          cargo build --locked --manifest-path client/Cargo.toml
          cargo fmt --manifest-path server/Cargo.toml -- --check
          cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path server/Cargo.toml
          cargo build --locked --manifest-path server/Cargo.toml
      - name: Rust server and client integration
        run: ROMSTORE_CLIENT="$PWD/client/target/debug/romstore-client" cargo test --locked --manifest-path server/Cargo.toml --test e2e -- --ignored
      - name: Headless SDL smoke test
        run: |
          SDL_VIDEODRIVER=dummy client/target/debug/romstore-client --smoke-test
          SDL_VIDEODRIVER=dummy cargo test --locked --manifest-path client/Cargo.toml --bin romstore-client sdl_text_rendering_refreshes_density_on_resize_and_bounds_the_cache -- --ignored
