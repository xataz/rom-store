name: Release

on:
  workflow_dispatch:
    inputs:
      component:
        description: Composant à publier
        required: true
        type: choice
        options:
          - client
          - server
      level:
        description: Incrément de version
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    container: xataze/roms-store-builder:latest
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RELEASE_NAME: ${{ inputs.component }}
      RELEASE_LEVEL: ${{ inputs.level }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # A dedicated token also allows CI to run on the generated tags.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Verify the checked commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/cache@v4
        with:
          key: cargo-${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cargo-${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-release-
          path: |
            /opt/cargo/registry/
            /opt/cargo/git/
            target/
      - name: Prepare and push the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo release -p "romstore-${RELEASE_NAME}" "${RELEASE_LEVEL}" --execute --no-confirm
