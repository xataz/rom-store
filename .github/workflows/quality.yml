name: Quality

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    container: xataze/roms-store-builder:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          key: cargo-${{ runner.os }}-quality-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cargo-${{ runner.os }}-quality-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-quality-
          path: |
            /opt/cargo/registry/
            /opt/cargo/git/
            target/
      - run: cargo check --workspace --all-targets
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --message-format=json -- -D warnings > clippy.json
      - name: Convert Clippy report
        if: ${{ !cancelled() && hashFiles('clippy.json') != '' }}
        run: gitlab-clippy < clippy.json > gl-code-quality-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-report
          path: gl-code-quality-report.json
