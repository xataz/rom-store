.base:
  tags:
    - self

.rust:
  extends: .base
  image:
    name: $CI_ENV_IMAGE
    pull_policy: always
  timeout: 1h
  # Explicite pour inclure aussi les merge requests (jobs sans rules exclus des MR).
  rules:
    - when: on_success
  variables:
    GIT_DEPTH: '0'
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: '1'
  cache:
    key:
      prefix: cargo-bookworm-x86_64-rust-1.100
      files:
        - client/Cargo.lock
        - server/Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
  before_script:
    - |
      set -eu
      CI_COMPONENT=all
      case "${CI_COMMIT_TAG:-}" in
        client-v*) CI_COMPONENT=client ;;
        server-v*) CI_COMPONENT=server ;;
      esac
      CI_CRATES="$CI_COMPONENT"
      if [ "$CI_COMPONENT" = all ]; then CI_CRATES='client server'; fi
      export CI_COMPONENT CI_CRATES
